name: Continuous integration and deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers
  PNPM_CONFIG_STORE_DIR: /tmp/pnpm-store

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  actionlint:
    name: Lint github actions workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.2

      - name: Lint workflows
        run: actionlint

  eslint:
    name: Lint with eslint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.2

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run eslint:check

  prettier:
    name: Check formatting with prettier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.2

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run prettier:check

  typescript:
    name: Check types with typescript
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.2

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run typescript:check

  vitest:
    name: Run tests with vitest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.2

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm run vitest:run

  storybook:
    name: Build storybook
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.2

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PNPM_CONFIG_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storybook
        run: pnpm run storybook:build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: storybook-static

  deploy:
    name: Deploy storybook to github pages
    needs:
      - actionlint
      - eslint
      - prettier
      - typescript
      - vitest
      - storybook
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
